<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário - Sua Música Favorita</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #6a11cb, #2575fc);
            min-height: 100vh;
            padding: 40px;
        }

        .container {
            max-width: 750px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.25);
        }

        h1 {
            text-align: center;
            color: #6a11cb;
            margin-bottom: 10px;
        }

        p {
            text-align: center;
            margin-bottom: 25px;
            color: #555;
        }

        fieldset {
            border: 2px solid #6a11cb;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 20px;
        }

        legend {
            color: #6a11cb;
            font-weight: bold;
            padding: 0 10px;
        }

        label {
            font-weight: bold;
        }

        input[type=text],
        input[type=email],
        input[type=number],
        input[type=date],
        select,
        textarea {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            margin-bottom: 15px;
            border-radius: 8px;
            border: 1px solid #ccc;
        }

        input[type=range] {
            width: 100%;
            margin-top: 10px;
            margin-bottom: 20px;
        }

        textarea {
            resize: vertical;
        }

        input[type=submit] {
            width: 100%;
            padding: 15px;
            background: #6a11cb;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 18px;
            cursor: pointer;
            transition: 0.3s;
        }

        input[type=submit]:hover {
            background: #4c0ea1;
        }

        .opcao {
            margin-bottom: 8px;
        }
    </style>

</head>

<body>

    <div class="container">

        <h1>🎵 Sua Música Favorita 🎵</h1>

        <p>
            Compartilhe seus gostos musicais respondendo às perguntas abaixo.
        </p>

        <form action=" https://webhook.site/e423de93-2296-4dca-bcd6-ed50b5bc20bf" method="get">

            <fieldset>

                <legend>Informações Pessoais</legend>

                <label for="nome">Nome</label>
                <input type="text" id="nome" name="nome" maxlength="50" required>

                <label for="email">E-mail</label>
                <input type="email" id="email" name="email" required>

                <label for="idade">Idade</label>
                <input type="number" id="idade" name="idade" min="10" max="100" required>

            </fieldset>

            <fieldset>

                <legend>Sua Música Favorita</legend>

                <label for="musica">Qual é sua música favorita?</label>
                <input type="text" id="musica" name="musica" required>

                <label for="cantor">Quem canta essa música?</label>
                <input type="text" id="cantor" name="cantor" required>

                


            </fieldset>

            <fieldset>

                <legend>Preferências Musicais</legend>

                <label>Qual gênero você mais gosta?</label>

                <div class="opcao">
                    <input type="radio" name="genero" value="Pop" required> Pop
                </div>

                <div class="opcao">
                    <input type="radio" name="genero" value="Rock"> Rock
                </div>

                <div class="opcao">
                    <input type="radio" name="genero" value="Rap"> Rap
                </div>

                <div class="opcao">
                    <input type="radio" name="genero" value="Sertanejo"> Sertanejo
                </div>

                <div class="opcao">
                    <input type="radio" name="genero" value="Outro"> Outro
                </div>

                <br>

                <label>Onde você costuma ouvir música?</label>

                <div class="opcao">
                    <input type="checkbox" name="plataforma" value="Spotify"> Spotify
                </div>

                <div class="opcao">
                    <input type="checkbox" name="plataforma" value="YouTube"> YouTube
                </div>

                <div class="opcao">
                    <input type="checkbox" name="plataforma" value="Apple Music"> Apple Music
                </div>

                <div class="opcao">
                    <input type="checkbox" name="plataforma" value="Deezer"> Deezer
                </div>

                <br>

                <label for="frequencia">Com que frequência você escuta música?</label>

                <select id="frequencia" name="frequencia" required>
                    <option value="">Selecione</option>
                    <option>Todos os dias</option>
                    <option>Algumas vezes por semana</option>
                    <option>Raramente</option>
                </select>

            </fieldset>

            <fieldset>

                <legend>Sua Opinião</legend>

                <label for="nota">Quanto você gosta da sua música favorita?</label>

                <input type="range" id="nota" name="nota" min="0" max="10">

                <label for="comentario">
                    Por que essa música é especial para você?
                </label>

                <textarea
                    id="comentario"
                    name="comentario"
                    rows="5"
                    maxlength="300"
                    placeholder="Escreva sua resposta..."
                    required></textarea>

            </fieldset>

            <input type="submit" value="🎵 Enviar Respostas">

        </form>

    </div>

</body>

</html>
